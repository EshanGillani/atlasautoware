# Hardware bringup parameters — the real car (Jetson + OAK-D Pro + RPLidar +
# VESC, actuated via PCA9685 PWM or direct VESC UART, auto-detected).
# Launched by launch/car_bringup_launch.py.  Calibrate before first drive:
# see docs/hardware.md.

drive_node:
  ros__parameters:
    drive_topic: '/drive'
    backend: 'auto'             # auto | pca9685 | vesc — auto probes both
    # shared actuation calibration
    max_speed: 7.0              # m/s at full throttle (start LOW, e.g. 2.0)
    max_steer: 0.36             # rad at full servo throw (Traxxas Slash linkage;
                                # 0.41 overdrives the servo into the stops)
    steer_invert: false
    steer_trim_us: 0.0          # pulse offset to drive straight
    cmd_timeout: 0.5            # s without /drive -> neutral
    arm_time: 2.0               # s of neutral at startup (ESC arming)
    # pca9685 backend (throttle pulse -> VESC PPM input)
    i2c_bus: 1                  # Jetson header i2c bus — check `i2cdetect -l`
    i2c_address: 0x40
    pwm_hz: 50.0
    throttle_channel: 0
    steer_channel: 1            # -1 if there is no separate steering servo
    neutral_us: 1500.0
    full_fwd_us: 2000.0
    full_rev_us: 1000.0
    steer_center_us: 1500.0
    steer_half_range_us: 400.0
    # vesc-uart backend (direct serial; also publishes wheel-speed odom)
    serial_port: '/dev/ttyACM0'
    serial_baud: 115200
    erpm_gain: 4614.0           # erpm per m/s — RE-MEASURE for the NEW sensored
                                # motor + FSESC 6.7: erpm_gain = (poles/2) * gear
                                # ratio * 60 / (pi * wheel_dia_m). Wrong gain =
                                # wrong speed scaling AND wrong odometry. Calibrate:
                                # command 2.0 m/s, measure true speed over 5 m,
                                # scale gain until they match.
    odom_topic: '/vesc/odom'
    odom_frame: 'odom'
    base_frame: 'base_link'
    telemetry_hz: 20.0

rplidar_node:
  ros__parameters:
    port: '/dev/ttyUSB0'
    baudrate: 115200            # A1/A2: 115200, A3/S1: 256000
    scan_topic: '/scan'
    frame_id: 'laser'
    num_bins: 720
    range_min: 0.10
    range_max: 25.0
    angle_offset: 0.0           # rad CCW, mounting yaw correction
    deskew_odom_topic: '/ekf/odom'  # per-beam motion correction; '' = off

velocity_ekf:
  ros__parameters:
    imu_topic: '/oakd/imu'
    wheel_odom_topic: '/vesc/odom'  # only published by the vesc-uart backend
    out_topic: '/ekf/odom'
    l_r: 0.17145                # m, CG to rear axle

oakd_camera:
  ros__parameters:
    width: 640
    height: 360
    fps: 30.0
    imu_hz: 200
    rgb_topic: '/oakd/rgb'
    info_topic: '/oakd/camera_info'
    imu_topic: '/oakd/imu'
    camera_frame: 'oakd_rgb'
    imu_frame: 'oakd_imu'
    yolo_blob: ''               # compiled .blob -> YOLO on the camera's VPU
    yolo_conf: 0.4              # (blobconverter from the trained ONNX)
    yolo_size: 416

camera_perception:
  ros__parameters:
    image_topic: '/oakd/rgb'
    odom_topic: '/pf/pose/odom'
    backend: 'auto'             # auto | tensorrt | cuda | cpu — auto prefers a
                                # .engine built on the Jetson (trtexec --fp16),
                                # then cv2.dnn CUDA, then CPU

raceline_mpc:
  ros__parameters:
    scan_topic: '/scan'
    odom_topic: '/pf/pose/odom' # map-frame pose from your localization
    drive_topic: '/drive'
    imu_topic: '/oakd/imu'      # enables the traction governor
    actuation_delay: 0.10       # s sensor->actuator latency (measure on YOUR car:
                                # step-steer test, lidar timestamp vs yaw-rate onset)
    max_lat_accel: 6.0          # m/s^2 grip budget (governor + profiler)
    aeb_decel: 6.0              # m/s^2 assumed braking for dynamic AEB range
    refine_corridor: 0.0        # m min-curvature refinement; 0 = off.
                                # KEEP 0 ON comp_track.  Measured against
                                # maps/comp_track.yaml: comp_raceline.csv already
                                # runs with only ~0.056 m between the car body
                                # (0.15 m half-width) and the wall at its
                                # tightest point.  The refiner bounds excursion
                                # from the input line but knows nothing about the
                                # map, so a 0.10 m corridor puts the body 0.043 m
                                # INSIDE the wall and 0.20 m touches it outright.
                                # Re-measure clearance on any new track before
                                # enabling this.
    reprofile_speeds: true      # friction-limited speeds from curvature at load
    profile_a_accel: 6.0        # m/s^2 engine limit (sensored motor: full smooth
                                # torque from 0 rpm + FSESC 6.7 current headroom)
    profile_a_brake: 8.0        # m/s^2 braking limit (VESC 6 regen current)
    profile_v_max: 8.0          # m/s profile ceiling
    v_scale: 0.5                # global speed cap — raise as confidence grows
    control_hz: 50.0
    # MPC cost weights.  These are what tools/bayes_tune.py searches over, and
    # `bayes_tune --apply` writes the winner back here — so a tuning result is
    # deployed whole rather than only its speed-profile half.
    #
    # These are the controller's conservative DEFAULTS, deliberately left alone:
    # tuned values come from a first-order grip model, not from your car on your
    # surface, so they are a starting hypothesis to validate, not a setting to
    # inherit.  Apply a tuned setup explicitly once you have driven it:
    #
    #   python3 tools/bayes_tune.py --mu-range 1.05 0.95 0.90 --apply
    #
    # Best simulated setup on comp_track, searched WITH this car's 100 ms
    # actuation delay and max_steer 0.36.  Verified over 12 unseen starts at
    # each grip level: 41.60 s and 100% all the way from mu 1.05 down to 0.80,
    # never saturating the tyres.
    #   mpc_horizon 12  q_pos 45.0  q_yaw 8.9  q_v 3.19  rd_steer 21.4
    #   max_lat_accel 4.56  profile_a_accel 3.38  profile_a_brake 6.70
    #   profile_v_max 7.08  v_scale 1.32
    #
    # Note rd_steer 21.4 rather than the ~5.7 a latency-free search picks.  With
    # 100 ms of lag an aggressive steering correction arrives after the car has
    # already moved, so the optimizer damps the steering hard.  That is the
    # single clearest sign a tuning result was produced without modelling delay.
    #
    # An earlier latency-free search reported 35.7 s for this track.  That
    # number was never real: measured against the actual 100 ms it is 41.9 s and
    # 0% reliable at mu 0.90.  Do not chase it.
    mpc_horizon: 12             # prediction steps
    mpc_q_pos: 28.0             # position tracking
    mpc_q_yaw: 6.0              # heading tracking
    mpc_q_v: 2.5                # speed tracking
    mpc_rd_steer: 12.0          # steer-rate penalty (lower = more responsive)
